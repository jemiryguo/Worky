<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden}button{display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin-top:3px;padding:0;background:#fff;color:#3c526f;border:1px solid #d0d8e4;border-radius:6px;cursor:pointer}button:hover{background:#f0f3f8;border-color:#819bbf}button:focus-visible{outline:2px solid #7f9eca;outline-offset:-2px}button:disabled{opacity:.5;cursor:wait}svg{width:18px;height:18px;pointer-events:none}html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"] button{background:#202a39;color:#d7dfeb;border-color:#3c4a5f}html[data-theme="dark"] button:hover{background:#2d3b50;border-color:#7f9ac2}
</style></head><body><button id="open-file" type="button" aria-label="导入 JSON" title="导入 JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7l-4-4ZM14 3v5h4M12 17v-6m-3 3 3-3 3 3"/></svg></button><input id="file" type="file" accept=".json,application/json" hidden><script>
const button=document.getElementById('open-file'),input=document.getElementById('file');
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
document.documentElement.dataset.theme=sessionStorage.getItem('colorTheme')||'light';
button.onclick=()=>{input.value='';input.click()};
input.onchange=async()=>{const file=input.files[0];if(!file)return;button.disabled=true;try{send('streamlit:setComponentValue',{value:{nonce:crypto.randomUUID(),filename:file.name,content:await file.text()},dataType:'json'})}catch{send('streamlit:setComponentValue',{value:{nonce:crypto.randomUUID(),error:'无法读取所选文件，请重试。'},dataType:'json'})}finally{button.disabled=false;input.value=''}};
window.addEventListener('keydown',e=>{if(e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey&&['z','y'].includes(e.key.toLowerCase())){e.preventDefault();e.stopImmediatePropagation();parent.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,ctrlKey:true,repeat:e.repeat,bubbles:true,cancelable:true}))}},true);
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){document.documentElement.dataset.theme=e.data.args.darkMode?'dark':'light';send('streamlit:setFrameHeight',{height:38})}});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:38});
</script><script src="tooltips.js?v=theme-1"></script></body></html>
