[project]
name = "worky"
version = "0.2.0"
description = "Personal tasks, hierarchical updates, and Gantt timelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock>=3.16",
    "markdown-it-py>=4.3.0",
    "streamlit>=1.50,<2",
    "tzdata>=2025.1",
]

[dependency-groups]
browser = ["playwright>=1.50,<2"]

[tool.uv]
package = false
